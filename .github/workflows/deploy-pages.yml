name: Deploy BZaudio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly authorize publishing the built site to production Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site for its Pages base path
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Verify built entry point and assets
        run: |
          test -s dist/index.html
          grep -Eq 'src="[^"]+\.js"' dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f | grep -Eq '\.(js|css)$'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: ${{ github.repository_visibility == 'public' && github.ref == 'refs/heads/main' && inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
