name: Prepare Playwright dependency

on:
  push:
    branches:
      - chore/reconcile-public-repo-docs

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: chore/reconcile-public-repo-docs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Playwright test runner and update lockfile
        run: npm install --save-dev @playwright/test --ignore-scripts --no-audit --no-fund

      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "test: add Playwright browser test dependency"
            git push origin HEAD:chore/reconcile-public-repo-docs
          fi
