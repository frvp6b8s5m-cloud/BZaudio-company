name: Pages artifact preflight

on:
  push:
    branches:
      - chore/reconcile-public-repo-docs
    paths:
      - .github/workflows/pages-preflight.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact without publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
